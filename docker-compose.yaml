services:
  postgres:
    container_name: postgres
    image: postgres:18-alpine
    env_file: ./.env
    ports:
      - $POSTGRES_PORT
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - private-net

  node:
    container_name: node
    image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
    env_file: ./.env
    ports:
      - $PORT
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 5s
      retries: 3
      timeout: 3s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shared-net
      - private-net

  nginx:
    container_name: nginx
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
    depends_on:
      node:
        condition: service_healthy
    networks:
      - shared-net

networks:
  shared-net:
    driver: bridge
  private-net:
    driver: bridge

volumes:
  pg_data:
    name: pg_data