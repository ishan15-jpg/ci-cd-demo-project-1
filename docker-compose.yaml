services:
  api-server:
    container_name: api-server
    image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
    env_file: 
      - ./.env
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 5s
      retries: 3
      timeout: 3s
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
    depends_on:
      api-server:
        condition: service_healthy