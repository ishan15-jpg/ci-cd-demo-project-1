services:
  node:
    container_name: node
    image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
    env_file: ./.env
    ports:
      - "$PORT"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:$${PORT}/health || exit 1"]
      interval: 5s
      retries: 3
      timeout: 3s
    networks:
      - shared-net

  nginx:
    container_name: nginx
    image: nginx:alpine
    env_file: ./.env
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "$NGINX_PORT:$NGINX_PORT"
    depends_on:
      node:
        condition: service_healthy
    networks:
      - shared-net

networks:
  shared-net:
    name: shared-net
    driver: bridge