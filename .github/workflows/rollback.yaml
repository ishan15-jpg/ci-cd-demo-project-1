name: Production Rollback Workflow

on: 
    workflow_dispatch:
        inputs:
            commit-sha:
                required: true
                type: string

permissions:
    contents: read

env:
    ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
    ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
    IMAGE_TAG: ${{ inputs.commit-sha }}

jobs:
    rollback:
        runs-on: ubuntu-latest
        environment: prod
        steps:
            - uses: appleboy/ssh-action@v1.2.5
              env:
                AWS_REGION: ${{ vars.AWS_REGION }}
              with:
                host: ${{ secrets.SERVER_IP }}
                username: ${{ secrets.SERVER_USER }}
                key: ${{ secrets.SERVER_SSH_KEY }}
                envs: ECR_REGISTRY, ECR_REPOSITORY, IMAGE_TAG, AWS_REGION
                script: |
                    # 1. Change directory
                    cd /home/ubuntu/app

                    # 2. Export variable
                    export ECR_REGISTRY=$ECR_REGISTRY
                    export ECR_REPOSITORY=$ECR_REPOSITORY
                    export IMAGE_TAG=$IMAGE_TAG

                    # 3. Login to AWS ECR registry
                    aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY

                    # 4. Stop existing container
                    docker stop node || true
                    docker rm node || true

                    # 5. Pull the stable image
                    docker compose pull

                    # 6. Run the stable container
                    docker compose up -d

                    # 8. Perform healthcheck
                    echo "Verifying restored application...."
                    for i in {1..11}; do
                        if [ "$(docker inspect --format '{{.State.Health.Status}}' node)" == "healthy" ]; then
                            echo "Rollback successfull...."
                            exit 0
                        fi
                        echo "Retrying! $((10-i)) retries left...."
                        sleep 5
                    done
                    echo "Rollback failed! Max retries exceeded...."
                    docker compose logs
                    exit 1