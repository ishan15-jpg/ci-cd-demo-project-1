name: CI workflow

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check secrets leaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}

  dependency-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Setup the node environment
        uses: actions/setup-node@v7
        with: 
          node-version: 24.x

      - name: Run dependency check
        run: npm audit --audit-level=high

  lint:
    needs:
      - gitleaks
      - dependency-check

    if: github.event_name == 'pull_request'
    
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Setup the node environment
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Perform type checking
        run: npx tsc --noEmit

      - name: Perform linting
        run: npm run lint
  
  test:
    needs:
      - gitleaks
      - dependency-check

    if: github.event_name == 'pull_request'

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x]

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Setup the node environment
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Run test cases
        run: npm run test

  build-and-test-image:
    needs:
      - lint
      - test

    if: github.event_name == 'pull_request'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Build image from the Dockerfile
        run: docker build -t image:latest .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: image:latest
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  build-and-push:
    needs:
      - gitleaks
      - dependency-check

    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env: 
      ECR_REPOSITORY: my-app
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Configure the AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE }}

      - name: Login to AWS ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build an image from the Dockerfile
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

      - name: Push the image to ECR registry
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  deploy:
    needs: build-and-push

    if: github.event_name == 'push'

    uses: ./.github/workflows/cd-staging.yaml