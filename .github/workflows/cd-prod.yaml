name: Production deployment workflow

on: 
    push:
        tags: "v*"

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
    ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
    IMAGE_TAG: ${{ github.sha }}
    AWS_ROLE: ${{ vars.AWS_ROLE }}
    AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment: prod
        steps:
            - uses: actions/checkout@v7

            - uses: appleboy/scp-action@v1
              with: 
                host: ${{ secrets.SERVER_IP }}
                username: ${{ secrets.SERVER_USER }}
                key: ${{ secrets.SERVER_SSH_KEY}}
                source: 'docker-compose.yaml,nginx.conf'
                target: '/home/ubuntu/app'
            
            - uses: appleboy/ssh-action@v1.2.5
              env: 
                APPLICATION_PORT: ${{ vars.APPLICATION_PORT }}
                NGINX_PORT: ${{ vars.NGINX_PORT }}
                DATABASE_URL: ${{ secrets.DATABASE_URL }}
              with: 
                host: ${{ secrets.SERVER_IP }}
                username: ${{ secrets.SERVER_USER }}
                key: ${{ secrets.SERVER_SSH_KEY }}
                envs: ECR_REGISTRY, ECR_REPOSITORY, IMAGE_TAG, APPLICATION_PORT, NGINX_PORT, DATABASE_URL, AWS_REGION
                script: |
                    # 1. Change directory
                    cd /home/ubuntu/app

                    # 2. Export variables
                    export ECR_REGISTRY=$ECR_REGISTRY
                    export ECR_REPOSITORY=$ECR_REPOSITORY
                    export IMAGE_TAG=$IMAGE_TAG

                    # 3. Create .env
                    cat <<EOF > .env
                    PORT=$APPLICATION_PORT
                    NGINX_PORT=$NGINX_PORT
                    DATABASE_URL=$DATABASE_URL
                    EOF

                    # 4. Login to ECR registry
                    aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY

                    # 5. Stop existing container
                    docker stop node || true
                    docker rm node || true

                    # 6. Pull latest image
                    docker compose pull

                    # 7. Run migrations
                    docker run --rm \
                    --env-file ./.env \
                    --network shared-net \
                    $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
                    npm run migrate up

                    # 8. Run application container
                    docker compose up -d

                    # 9. Perform healthcheck
                    for i in {1..11}; do
                        if [ "$(docker inspect --format '{{.State.Health.Status}}' node)" == "healthy" ]; then
                            echo "Deployment successfull...."
                            exit 0
                        fi
                        echo "Retrying! $((10-i)) retries left...."
                        sleep 5
                    done
                    echo "Deployment failed! Maximum retries exceeded...."
                    docker compose logs
                    exit 1