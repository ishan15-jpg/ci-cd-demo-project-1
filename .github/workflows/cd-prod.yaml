name: Production CD workflow

on: 
    push: 
        tags:
            - "v*"

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest

        environment: prod

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Copy docker-compose.yaml and nginx.conf files to production server
              uses: appleboy/scp-action@v1
              with: 
                host: ${{ secrets.SERVER_IP }}
                username: ${{ secrets.SERVER_USER }}
                key: ${{ secrets.SERVER_SSH_KEY }}
                source: "docker-compose.yaml, nginx.conf"
                target: "/home/ubuntu/app"

            - name: Deploy application to production server
              uses: appleboy/ssh-action@v1
              env:
                AWS_REGION: ${{ secrets.AWS_REGION }}
                AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
                IMAGE_TAG: ${{ github.sha }}
                APPLICATION_PORT: ${{ secrets.APPLICATION_PORT }}
                NGINX_PORT: ${{ secrets.NGINX_PORT }}
                DATABASE_URL: ${{ secrets.DATABASE_URL }}
                POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
                POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
                POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
                POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
                POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
              with: 
                host: ${{ secrets.SERVER_IP }}
                username: ${{ secrets.SERVER_USER }}
                key: ${{ secrets.SERVER_SSH_KEY }}
                envs: AWS_REGION, AWS_ACCOUNT_ID, IMAGE_TAG, APPLICATION_PORT, NGINX_PORT, DATABASE_URL, POSTGRES_HOST, POSTGRES_USER, POSTGRES_DB, POSTGRES_PASSWORD, POSTGRES_PORT
                script: |
                    # 1. Move to /home/ubuntu/app
                    cd /home/ubuntu/app

                    # 2. Export variables
                    export ECR_REGISTRY=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
                    export ECR_REPOSITORY=my-app
                    export IMAGE_TAG=$IMAGE_TAG

                    # 3. Create .env file
                    cat <<EOF > .env
                    PORT=$APPLICATION_PORT
                    NGINX_PORT=$NGINX_PORT
                    DATABASE_URL=$DATABASE_URL
                    POSTGRES_HOST=$POSTGRES_HOST
                    POSTGRES_USER=$POSTGRES_USER
                    POSTGRES_DB=$POSTGRES_DB
                    POSTGRES_PASSWORD=$POSTGRES_PASSWORD
                    POSTGRES_PORT=$POSTGRES_PORT
                    EOF

                    # 4. Login docker to AWS ECR registry
                    aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY

                    # 5. Stop existing running container
                    docker stop node || true
                    docker rm node || true

                    # 6. Pull  the latest image
                    docker compose pull

                    # 7. Start the services
                    docker compose up -d

                    # 8. Run the migration container
                    docker run --rm \
                        --network private-net \
                        --env-file ./.env \
                        $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
                        npm run migrate up

                    # 9. Perform health check
                    echo "Deploying application..."
                    for i in {1..11}; do 
                        if [ "$(docker inspect --format '{{.State.Health.Status}}' node)" == "healthy" ]; then
                            echo "Deployment successfull..."
                            exit 0
                        fi
                        echo "Retrying deployment! $((10-i)) retries left..."
                    done
                    echo "Deployment failed! Max retries exceeded..."
                    docker compose logs
                    exit 1