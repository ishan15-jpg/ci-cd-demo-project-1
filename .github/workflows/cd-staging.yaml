name: Staging CD workflow

on: 
    push: 
        branches:
            - develop

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
    ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
    IMAGE_TAG: ${{ github.sha }}
    AWS_REGION: ${{ vars.AWS_REGION }}
    AWS_ROLE: ${{ vars.AWS_ROLE }}

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: read
        steps:
            - uses: actions/checkout@v7

            - run: docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

            - uses: aquasecurity/trivy-action@v0.36.0
              with:
                image-ref: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
                format: 'json'  
                exit-code: '1'
                ignore-unfixed: true
                vuln-type: 'os,library'
                severity: 'CRITICAL,HIGH'

            - uses: aws-actions/configure-aws-credentials@v6.3.0
              with: 
                role-to-assume: ${{ env.AWS_ROLE }}
                aws-region: ${{ env.AWS_REGION }}

            - uses: aws-actions/amazon-ecr-login@v2.1.7

            - run: docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

    deploy:
        needs: build-and-test
        runs-on: ubuntu-latest
        environment: staging
        steps:
            - uses: actions/checkout@v7

            - uses: appleboy/scp-action@v1
              with:
                host: ${{ secrets.SERVER_IP }}
                username: ${{ secrets.SERVER_USER }}
                key: ${{ secrets.SERVER_SSH_KEY }}
                source: 'docker-compose.yaml,nginx.conf'
                target: '/home/ubuntu/app'
            
            - uses: appleboy/ssh-action@v1.2.5
              env: 
                APPLICATION_PORT: ${{ vars.APPLICATION_PORT }}
                NGINX_PORT: ${{ vars.NGINX_PORT }}
                DATABASE_URL: ${{ secrets.DATABASE_URL }}
              with:
                host: ${{ secrets.SERVER_IP }}
                username: ${{ secrets.SERVER_USER }}
                key: ${{ secrets.SERVER_SSH_KEY }}
                envs: ECR_REGISTRY, ECR_REPOSITORY, IMAGE_TAG, APPLICATION_PORT, NGINX_PORT, DATABASE_URL, AWS_REGION
                script: |
                    # 1. Change directory
                    cd /home/ubuntu/app

                    # 2. Export variables
                    export ECR_REGISTRY=$ECR_REGISTRY
                    export ECR_REPOSITORY=$ECR_REPOSITORY
                    export IMAGE_TAG=$IMAGE_TAG

                    # 3. Create .env file
                    cat <<EOF > .env
                    PORT=$APPLICATION_PORT
                    NGINX_PORT=$NGINX_PORT
                    DATABASE_URL=$DATABASE_URL
                    EOF

                    # 4. Docker login
                    aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY

                    # 5. Stop existing container
                    docker stop node || true
                    docker rm node || true

                    # 6. Pull latest container
                    docker compose pull

                    # 7. Run migrations
                    docker run --rm \
                    --env-file ./.env \
                    --network shared-net \
                    $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
                    npm run migrate up

                    # 8. Run application container
                    docker compose up -d

                    # 9. Perform healthcheck
                    echo "Deploying application...."
                    for i in {1..11}; do
                        if [ "$(docker inspect --format '{{.State.Health.Status}}' node)" == "healthy" ]; then
                            echo "Deployment successfull...."
                            exit 0
                        fi
                        echo "Retrying! $((10-i)) retries left...."
                        sleep 5
                    done
                    echo "Deployment failed! Max retries exceeded...."
                    docker compose logs
                    exit 1